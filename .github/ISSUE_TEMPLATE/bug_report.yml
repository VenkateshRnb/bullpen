name: Bug report
description: Something does not work the way the documentation says.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest task file and config that shows it. Please leave out anything private.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `bullpen doctor` and `bullpen --version`
      render: text
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant lines from .bullpen/STATUS.md or .bullpen/logs
      description: Check them for private information before pasting.
      render: text
  - type: input
    id: os
    attributes:
      label: Operating system and Node version
      placeholder: "Windows 11, Node 24.1"
    validations:
      required: true
