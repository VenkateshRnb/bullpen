name: Feature request
description: Suggest an improvement or a new agent adapter.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered instead?
  - type: markdown
    attributes:
      value: |
        Bullpen is deliberately small. Features that need runtime dependencies, or that move it toward a
        general agent framework, are unlikely to be accepted. New agent CLIs usually need only configuration;
        see docs/adding-an-agent.md.
